name: Live tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  live:
    name: Network tests against real YouTube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Run network tests
        run: uv run pytest --run-network -m network
